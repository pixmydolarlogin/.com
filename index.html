<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PIXMYDOLLAR - Avaliação de Produtos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0f3f5a; --card:#f6f2e9; --text:#0b1e29; --muted:#6f7b86;
      --primary:#0f3f5a; --accent-red:#c83a3a; --accent-blue:#1e5fa4;
      --gold:#f4c542; --radius:28px; --success:#2ecc71;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);background:var(--bg);display:grid;place-items:center;min-height:100vh;padding:24px}
    .app{width:min(820px,100%)}
    .card{background:var(--card);border-radius:var(--radius);padding:48px 28px 32px;box-shadow:0 8px 30px rgba(0,0,0,.25);position:relative;transition:opacity .4s ease}
    .hidden{display:none!important}
    .fade-out{opacity:0}
    .brand{display:grid;place-items:center;gap:14px;margin-bottom:28px}
    .logo-text{font-weight:800;font-size:32px;letter-spacing:.5px;}
    .logo-text .pix{color:var(--accent-red)} .logo-text .my{color:var(--accent-blue)}
    h1{text-align:center}
    .subtitle{text-align:center;color:var(--muted);margin-bottom:26px}
    form{display:grid;gap:18px}
    .input{padding:18px 20px;border-radius:14px;border:2px solid #cad3da;font-size:18px;width:100%}
    .btn{border:0;border-radius:16px;padding:18px 20px;background:var(--primary);color:#fff;font-size:22px;font-weight:800;cursor:pointer;transition:.2s}
    .btn:hover{filter:brightness(1.1)}
    .terms{text-align:center;color:#7b8792;margin-top:26px}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--card);border-radius:18px;margin-bottom:16px}
    .wallet{display:flex;align-items:center;gap:12px}
    .wallet .amount{font-weight:800;border:2px solid var(--primary);padding:10px 16px;border-radius:14px}
    .wallet .withdraw{background:var(--primary);color:#fff;padding:12px 18px;border-radius:14px;font-weight:800;border:0;cursor:pointer}
    .stage{background:var(--card);border-radius:26px;padding:18px}
    .progress{height:12px;background:#d8d8d8;border-radius:999px;overflow:hidden;margin-bottom:18px}
    .bar{height:100%;width:0;background:var(--accent-blue);transition:width .3s ease}
    .product{background:#fff;border-radius:20px;padding:14px;box-shadow:0 4px 16px rgba(0,0,0,.12);position:relative;overflow:hidden;border:2px solid #d9e0e6;text-align:center;animation:fadeIn .6s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .badge{position:absolute;top:14px;right:14px;background:var(--primary);color:#fff;font-weight:800;padding:10px 14px;border-radius:14px;font-size:18px}
    .product img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:14px;display:block;margin-bottom:10px}
    .question{text-align:center;font-size:20px;font-weight:700;margin:16px 0 10px}
    .cta{display:block;width:100%;background:var(--primary);color:#fff;border:0;padding:12px;border-radius:14px;font-size:18px;font-weight:800;margin-top:6px;cursor:pointer;transition:.2s}
    .cta.done{background:var(--success)!important;}
    .cta[disabled]{opacity:.6;cursor:not-allowed}
    .grid{display:grid;grid-template-columns:1fr;gap:22px}
    @media(min-width:680px){.grid{grid-template-columns:repeat(1,1fr)}}
    .bottomnav{display:flex;justify-content:space-around;align-items:center;flex-wrap:wrap;gap:18px;margin-top:28px;background:linear-gradient(145deg,var(--accent-blue),var(--primary));padding:18px 10px;border-radius:24px;box-shadow:0 6px 25px rgba(0,0,0,.3)}
    .bottomnav button{flex:1;min-width:140px;background:var(--gold);color:#0b1e29;border:0;border-radius:16px;padding:12px 14px;font-weight:800;font-size:16px;cursor:pointer;transition:.25s;box-shadow:0 4px 10px rgba(0,0,0,.2)}
    .bottomnav button:hover{transform:translateY(-3px);filter:brightness(1.1)}
    .withdraw-form{display:grid;gap:18px;text-align:center}
  </style>
</head>
<body>
  <div class="app">

    <!-- LOGIN -->
    <main id="loginScreen" class="card">
      <header class="brand">
        <div class="logo-text"><span class="pix">PIX</span><span class="my">MY</span><span class="pix">DOLLAR</span></div>
      </header>
      <h1>Seja bem-vindo!</h1>
      <p class="subtitle">Acesse o app com seu e-mail</p>
      <form id="loginForm">
        <input class="input" id="email" type="email" placeholder="Seu e-mail" required />
        <button class="btn" type="submit">ENTRAR</button>
      </form>
      <p class="terms">Ao utilizar o app, você concorda com os nossos Termos de uso</p>
    </main>

    <!-- TAREFAS -->
    <section id="taskScreen" class="hidden">
      <div class="topbar">
        <div class="wallet">
          <div class="amount" id="amount">R$ 0,00</div>
          <button class="withdraw" id="withdrawTopBtn">SACAR</button>
        </div>
        <button id="logoutBtn" style="background:#c83a3a;color:#fff;border:0;padding:12px 18px;border-radius:14px;font-weight:800;cursor:pointer">SAIR</button>
      </div>

      <div class="stage card">
        <div class="progress"><div id="bar" class="bar"></div></div>
        <div id="products" class="grid"></div>
      </div>

      <nav class="bottomnav">
        <button id="vipBtn">🧭 Quero ser VIP</button>
        <button id="saquesBtn">💸 Saques</button>
        <button id="tarefasBtn">🔄 Volte as Tarefas</button>
        <button id="premioBtn">🎁 Prêmio Instantâneo</button>
      </nav>
    </section>

    <!-- FORMULÁRIO DE SAQUE -->
    <section id="withdrawScreen" class="card hidden">
      <div class="topbar">
        <div class="wallet">
          <div class="amount" id="amountWithdraw">R$ 0,00</div>
        </div>
        <button id="logoutBtnWithdraw" style="background:#c83a3a;color:#fff;border:0;padding:10px 16px;border-radius:12px;font-weight:800;cursor:pointer">SAIR</button>
      </div>
      <h2 style="text-align:center;">Solicitar Saque</h2>
      <p class="subtitle">Preencha os dados abaixo para receber via Pix</p>
      <form id="withdrawForm" class="withdraw-form">
        <input class="input" type="text" id="nomePix" placeholder="Seu nome completo" required>
        <input class="input" type="email" id="emailPix" placeholder="Seu e-mail" required>
        <input class="input" type="text" id="chavePix" placeholder="Sua chave Pix (CPF, e-mail ou celular)" required>
        <button class="btn" type="submit" id="submitWithdraw">Solicitar Saque</button>
        <button class="btn" type="button" id="cancelWithdraw" style="background:#6f7b86">Cancelar</button>
      </form>
    </section>

  </div>

  <audio id="coinSound" src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_3f65e021ba.mp3?filename=coin-drop-1.mp3" preload="auto"></audio>

  <script>
    const WITHDRAW_URL = "https://redirect.urusoficial.com.br/ZCFDTUUEDK3MY?a=E3ffgAiM";

    // 💵 Produtos com recompensas entre R$ 10,00 e R$ 80,00
    const productsData = Array.from({length:10}).map((_,i)=>({
      id:i+1,
      title:`Avalie Agora #${i+1}`,
      reward:Number((Math.random() * (80 - 10) + 10).toFixed(2)),
      img:`https://picsum.photos/seed/prod${i+3}/800/500`,
      questions:["Você gostaria de conhecer esse lugar?","Você levaria um amigo?","Recomendaria essa viagem?"]
    }));

    let total=0, completed=0, currentIndex=0;
    let currentEmail=null;
    let prizeClaimed = false; // Flag para garantir que o prêmio seja concedido apenas uma vez

    const toBR = n => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n);
    const playCoin=()=>{const s=document.getElementById('coinSound');s.currentTime=0;s.play().catch(()=>{});};
    const show=el=>el.classList.remove('hidden');
    const hide=el=>el.classList.add('hidden');

    const storageKey = email => `pixmydollar:${email.toLowerCase().trim()}`;
    function saveState(){
      if(!currentEmail) return;
      const data={total,completed,currentIndex};
      localStorage.setItem(storageKey(currentEmail), JSON.stringify(data));
    }
    function loadState(email){
      try{
        const raw=localStorage.getItem(storageKey(email));
        if(!raw) return null;
        const data=JSON.parse(raw);
        if(typeof data.total==="number") return data;
      }catch(e){}
      return null;
    }

    setInterval(saveState,3000);
    window.addEventListener("beforeunload",saveState);

    function updateAmount(){
      document.getElementById('amount').textContent = toBR(total);
      document.getElementById('amountWithdraw').textContent = toBR(total);
    }
    function updateProgress(){
      document.getElementById('bar').style.width = (completed/productsData.length*100)+'%';
    }

    const loginScreen = document.getElementById('loginScreen');
    const taskScreen  = document.getElementById('taskScreen');
    const withdrawScreen = document.getElementById('withdrawScreen');

    function renderCurrentProduct(){
      const wrap=document.getElementById('products');
      wrap.innerHTML='';
      if(currentIndex >= productsData.length){
        wrap.innerHTML = `
          <article class="product">
            <h2>🎉 Parabéns!</h2>
            <p>Você concluiu todas as avaliações.</p>
            <p><strong>Total ganho:</strong> ${toBR(total)}</p>
            <button class="cta" id="SacarBtn">🔁 Solicitar Saque</button>
          </article>`;
        document.getElementById('SacarBtn').addEventListener('click', goToWithdraw);
        return;
      }
      const p = productsData[currentIndex];
      const card=document.createElement('article');
      card.className='product';
      card.innerHTML=`
        <span class="badge">+${toBR(p.reward)}</span>
        <img src="${p.img}" alt="${p.title}" loading="lazy"/>
        <h3>${p.title}</h3>
        <div class="questions" id="q${p.id}"></div>
        <p style="color:var(--muted);margin-top:10px;">Produto ${currentIndex+1} de ${productsData.length}</p>
      `;
      wrap.appendChild(card);
      renderQuestions(p, card.querySelector('.questions'));
    }

    function renderQuestions(p,container){
      let answered=0;
      function showQuestion(idx){
        if(idx>=p.questions.length){
          container.innerHTML='<button class="cta done">✓ Concluir produto</button>';
          const doneBtn = container.querySelector('.done');
          doneBtn.addEventListener('click',()=>{
            total+=p.reward; completed++; currentIndex++;
            updateAmount(); updateProgress(); playCoin(); saveState();
            document.querySelector('.product').classList.add('fade-out');
            setTimeout(()=>{renderCurrentProduct();},400);
          });
          return;
        }
        container.innerHTML=`
          <p class="question">${p.questions[idx]}</p>
          <button class="cta">👍 Sim</button>
          <button class="cta">👎 Não</button>
        `;
        container.querySelectorAll('.cta').forEach(btn=>{
          btn.addEventListener('click',()=>{ playCoin(); answered++; showQuestion(answered); });
        });
      }
      showQuestion(0);
    }

    document.getElementById('loginForm').addEventListener('submit',ev=>{
      ev.preventDefault();
      const email=document.getElementById('email').value.trim();
      if(!email) return;
      currentEmail=email;
      const prev=loadState(email);
      if(prev){
        total=prev.total; completed=prev.completed; currentIndex=prev.currentIndex;
      }else{
        total=0; completed=0; currentIndex=0;
      }
      hide(loginScreen); show(taskScreen);
      updateAmount(); updateProgress(); renderCurrentProduct();
      saveState();
    });

    document.getElementById('vipBtn').addEventListener('click', () => {
      // Delay de 2 segundos antes de redirecionar
      setTimeout(() => {
        window.location.href = "https://redirect.urusoficial.com.br/GNHF447NHNVZP?a=E3ffgAiM";
      }, 2000); // 2000ms = 2 segundos
    });

    document.getElementById('saquesBtn').addEventListener('click', goToWithdraw);
    document.getElementById('tarefasBtn').addEventListener('click', () => {
      // Reinicia o progresso e começa as tarefas desde o início
      total = 0;
      completed = 0;
      currentIndex = 0;

      // Atualiza o valor e o progresso
      updateAmount();
      updateProgress();
      
      // Exibe as tarefas novamente
      renderCurrentProduct();
    });
    document.getElementById('premioBtn').addEventListener('click', () => {
      if (prizeClaimed) {
        alert('🎁 Você já ganhou um prêmio instantâneo!');
        return;
      }

      const premio = Number((Math.random() * 70 + 10).toFixed(2));
      total += premio;
      updateAmount();
      playCoin();
      saveState();

      prizeClaimed = true;  // Marca o prêmio como concedido

      alert(`🎁 Parabéns! Você ganhou ${toBR(premio)}!`);
    });
    document.getElementById('withdrawTopBtn').addEventListener('click', goToWithdraw);

    function goToWithdraw(){
      hide(loginScreen); hide(taskScreen); show(withdrawScreen); updateAmount();
    }

    document.getElementById('withdrawForm').addEventListener('submit',ev=>{
      ev.preventDefault();
      const nome=document.getElementById('nomePix').value.trim();
      const email=document.getElementById('emailPix').value.trim();
      const chave=document.getElementById('chavePix').value.trim();
      if(!nome||!email||!chave){alert('Preencha todos os campos!');return;}
      saveState();
      alert(`✅ Solicitação enviada!\n\nNome: ${nome}\nE-mail: ${email}\nChave Pix: ${chave}\nValor: ${toBR(total)}\n\nVocê será redirecionado para a página de saque.`);
      window.location.href=WITHDRAW_URL;
    });

    document.getElementById('cancelWithdraw').addEventListener('click',()=>{
      hide(withdrawScreen); show(taskScreen);
    });

    function logoutToLogin(){
      saveState();
      const confirmExit=confirm("Tem certeza que deseja sair? Seu progresso será salvo.");
      if(!confirmExit) return;
      currentEmail=null;
      hide(taskScreen); hide(withdrawScreen); show(loginScreen);
      document.getElementById('email').value='';
    }
    document.getElementById('logoutBtn').addEventListener('click', logoutToLogin);
    document.getElementById('logoutBtnWithdraw').addEventListener('click', logoutToLogin);
  </script>
</body>
</html>
